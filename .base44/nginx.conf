# Fronts the FastAPI docs dev server for the Base44 preview (see
# docker-compose.base44.yml).
#
# `zensical serve` injects a live-reload client that connects to a hardcoded
# `ws://` URL. The preview is served over HTTPS, so the browser blocks that
# insecure socket ("Mixed Content" / SecurityError). This proxy rewrites the
# injected URL to `wss://` and upgrades the connection through to the dev server,
# which keeps live reload working over the preview's TLS termination.
#
# Only zensical's injected client is rewritten — documentation samples that
# mention `ws://` URLs are left untouched.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    location / {
        proxy_pass http://docs:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Reload connections stay open for the whole session.
        proxy_read_timeout 1h;

        # sub_filter needs the response uncompressed.
        proxy_set_header Accept-Encoding "";
        sub_filter 'new WebSocket(`ws://' 'new WebSocket(`wss://';
        sub_filter_once on;
    }
}
