services:
  app:
    image: python:3.11-slim
    working_dir: /app
    labels:
      base44.project: "FastAPI Demo App"
      base44.kind: "web"
      base44.port: "3000"
      base44.docs: "/docs"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - UV_PROJECT_ENVIRONMENT=/opt/venv
    volumes:
      - ./:/app
      - app-deps:/opt/venv
    command:
      [
        "sh", "-ec",
        "pip install --quiet uv && uv sync --locked --extra standard --no-dev && exec uv run uvicorn demo_app:app --host 0.0.0.0 --port 3000 --reload",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure

volumes:
  app-deps:
