services:
  app:
    image: python:3.11-slim
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
    command:
      [
        "sh", "-ec",
        "pip install --quiet uv && uv sync --extra standard --no-dev && exec uv run uvicorn demo_app:app --host 0.0.0.0 --port 3000 --reload",
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
