services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir -e . uvicorn[standard] &&
        exec uvicorn landing.main:app --host 0.0.0.0 --port 3000 --reload --reload-dir /app/landing
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
