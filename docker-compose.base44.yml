services:
  app:
    image: python:3.11-slim
    working_dir: /app
    labels:
      base44.project: "Mitaka Work & Life LP"
      base44.kind: "web"
      base44.port: "3000"
      base44.docs: "/docs"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - UV_PROJECT_ENVIRONMENT=/opt/venv
    volumes:
      - ./:/app
      - app-deps:/opt/venv
    command:
      [
        "sh", "-ec",
        "pip install --quiet uv && uv sync --locked --extra standard --no-dev && exec uv run uvicorn landing.main:app --host 0.0.0.0 --port 3000 --reload --reload-dir landing",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; assert all(len(u.urlopen('http://localhost:3000'+p).read())>0 for p in ('/','/css/style.css')), 'landing page or its stylesheet was not served'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure

volumes:
  app-deps:
